<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>林家出遊手冊</title>
<style>
  :root{--g:#2f6f4f;--bg:#f6f4ef;--card:#fff;--ink:#28312c;--sub:#6b756f;--warn:#b45309;--line:#e4e0d6;
        --park:#3a8f5f;--cafe:#a5722a;--indoor:#3d6fa8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 14px 40px}
  header{padding:18px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:1.25rem;color:var(--g)}
  #kidline{font-size:.8rem;color:var(--sub);margin-top:2px}
  #timelink{flex-shrink:0;background:var(--g);color:#fff;font-size:.72rem;letter-spacing:.06em;padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:700}
  .btnrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 10px}
  .scen{font-size:1.05rem;padding:15px 4px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-align:center;line-height:1.5}
  .scen small{display:block;font-size:.72rem;color:var(--sub)}
  .scen.on{border-color:var(--g);background:#ebf3ee}
  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{font-size:.8rem;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--sub)}
  .chip.on{border-color:var(--g);color:var(--g);background:#ebf3ee}
  .chip.all{margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card.park{border-left-color:var(--park)} .card.cafe{border-left-color:var(--cafe)} .card.indoor{border-left-color:var(--indoor)}
  .card h2{font-size:1.02rem;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .badge{font-size:.68rem;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .stale{color:var(--warn);border-color:var(--warn)}
  .meta{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--sub);margin:8px 0 2px}
  .meta b{color:var(--ink);font-weight:600}
  .dots{letter-spacing:1px}
  .fee{font-size:.8rem;color:var(--warn);margin-top:5px}
  .kfit{display:flex;gap:6px;margin:7px 0 2px;flex-wrap:wrap}
  .kfit span{font-size:.74rem;background:#f0ede5;border-radius:999px;padding:3px 9px}
  .reason{font-size:.85rem;margin:6px 0 2px;line-height:1.55}
  .facrow{font-size:.76rem;color:var(--sub);margin-top:7px;line-height:1.8}
  .foot{font-size:.74rem;color:var(--sub);margin-top:6px;line-height:1.6}
  .rain{font-size:.82rem;background:#eef4fb;border-radius:8px;padding:7px 10px;margin-top:8px}
  .actrow{display:flex;gap:8px;margin-top:10px}
  .act{flex:1;text-align:center;font-size:.82rem;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
  .act.nav{border-color:var(--g);color:var(--g);font-weight:600}
  .exp{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:.8rem;line-height:1.65;color:var(--ink)}
  .card.open .exp{display:block}
  .exp h4{font-size:.78rem;color:var(--sub);margin:7px 0 2px;font-weight:600}
  .wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center;margin-top:3px}
  .wgrid div{background:#f6f4ef;border-radius:8px;padding:6px 2px;font-size:.74rem;color:var(--sub)}
  .wgrid b{display:block;color:var(--ink);font-size:.85rem}
  .ghead{font-size:.86rem;font-weight:700;margin:16px 2px 8px;display:flex;align-items:center;gap:6px}
  .ghead .cnt{font-size:.7rem;color:var(--sub);font-weight:400}
  #empty{color:var(--sub);font-size:.9rem;text-align:center;padding:30px 0}
  footer{font-size:.7rem;color:var(--sub);text-align:center;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div><h1>林家出遊手冊</h1><div id="kidline"></div></div>
  <a id="timelink" href="time.html">⏳ 時光手冊</a>
</header>

<div class="btnrow">
  <button class="scen" data-s="hot">☀️<small>晴熱</small></button>
  <button class="scen" data-s="rain">🌧<small>下雨</small></button>
  <button class="scen" data-s="cool">🍃<small>舒服</small></button>
</div>
<div class="chips">
  <button class="chip" data-f="free">免費優先</button>
  <button class="chip" data-f="meal">要有餐</button>
  <button class="chip" data-f="coffee">要有咖啡</button>
  <button class="chip all" id="allbtn">📚 全部景點</button>
</div>

<div id="cards"></div>
<div id="empty" hidden>選一個天氣情境,或按「📚 全部景點」瀏覽</div>

<footer>資料版本:2026-07-19・共 15 筆景點<br>車程與雨備分鐘為座標估算值;「待重驗」= 超過 6 個月未確認<br>點卡片「詳細」可展開完整評分與依據</footer>

      <span>🚗 <b>${typeof v.drive === "number" ? v.drive + " 分" : "待確認"}</b></span>
      <span>🌳 遮蔭 <b class="dots">${dots(v.shade)}</b></span>
      <span>🔊 容忍 <b class="dots">${dots(v.noise)}</b></span>
      <span>🛴 <b>${v.ride.ok === true ? "可騎" : v.ride.ok === false ? "不可" : "待確認"}</b></span>
    </div>
    <div class="fee">💰 ${v.fee}</div>
    ${compact ? "" : `
    <div class="kfit">${ks.map(k => `<span>${k.n}(${k.band}):${typeof v.age_fit[k.band].score === "number" ? v.age_fit[k.band].score + "/3" : "待確認"}</span>`).join("")}</div>
    <div class="reason">${bindingReason(v, ks)}</div>`}
    <div class="facrow">${facLine(v)}</div>
    <div class="foot">上次確認:${v.last_verified}・林家評價:${lastLog(v)}</div>
    ${v.type === "戶外公園" ? backupOf(v) : ""}
    <div class="actrow">
      <a class="act nav" href="${navUrl(v)}" target="_blank" rel="noopener">🧭 導航</a>
      <button class="act" onclick="this.closest('.card').classList.toggle('open')">📖 詳細</button>
    </div>
    <div class="exp">
      <h4>天氣適性(0–3)</h4>
      <div class="wgrid">${["晴熱", "晴涼", "小雨", "大雨"].map(k => `<div>${k}<b>${typeof v.weather_fit[k] === "number" ? v.weather_fit[k] : "?"}</b></div>`).join("")}</div>
      <h4>各年齡帶適合度</h4>
      ${["0-2", "2-4", "4-6", "6-9"].map(b => `<div><b>${b}(${typeof v.age_fit[b].score === "number" ? v.age_fit[b].score + "/3" : "待確認"})</b>:${v.age_fit[b].reason}</div>`).join("")}
      <h4>滑步車/推車</h4><div>${v.ride.note}</div>
      <h4>遮蔭依據</h4><div>${v.shade_basis}</div>
      <h4>聲量依據</h4><div>${v.noise_basis}</div>
      ${v.address ? `<h4>地址</h4><div>${v.address}</div>` : ""}
    </div>
  </div>`;
}

function render() {
  const ks = kidInfo();
  $("#kidline").textContent = ks.map(k => `${k.n} ${Math.floor(k.mo / 12)}歲${k.mo % 12}月(${k.band})`).join("・");
  const cards = $("#cards"), empty = $("#empty");
  if (!mode) { cards.innerHTML = ""; empty.hidden = false; return; }
  empty.hidden = true;
  if (mode === "rec") {
    cards.innerHTML = rank().map(({ v }) => cardHtml(v, ks, false)).join("");
  } else {
    let list = VENUES.filter(v => v.status !== "closed");
    if (filters.meal) list = list.filter(v => v.flags.meal);
    if (filters.coffee) list = list.filter(v => v.flags.coffee);
    if (filters.free) list = [...list].sort((a, b) => b.flags.free - a.flags.free);
    cards.innerHTML = ["park", "cafe", "indoor"].map(cat => {
      const g = list.filter(v => CAT(v.type) === cat);
      if (!g.length) return "";
      const gs = filters.free ? g : [...g].sort((a, b) => driveNum(a) - driveNum(b));
      return `<div class="ghead">${CEMOJI[cat]} ${CNAME[cat]} <span class="cnt">${gs.length} 筆</span></div>` + gs.map(v => cardHtml(v, ks, true)).join("");
    }).join("");
  }
}

$$(".scen").forEach(b => b.onclick = () => {
  scen = b.dataset.s; mode = "rec";
  $$(".scen").forEach(x => x.classList.toggle("on", x === b));
  $("#allbtn").classList.remove("on");
  render();
});
$("#allbtn").onclick = () => {
  mode = mode === "all" ? (scen ? "rec" : null) : "all";
  $("#allbtn").classList.toggle("on", mode === "all");
  if (mode === "all") $$(".scen").forEach(x => x.classList.remove("on"));
  else if (scen) $$(".scen").forEach(x => x.classList.toggle("on", x.dataset.s === scen));
  render();
};
$$(".chip:not(.all)").forEach(b => b.onclick = () => { const f = b.dataset.f; filters[f] = !filters[f]; b.classList.toggle("on", filters[f]); render(); });
render();
</script>
</body>
</html>
