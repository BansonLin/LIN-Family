<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>林家出遊手冊</title>
<style>
  :root{--g:#2f6f4f;--bg:#f6f4ef;--card:#fff;--ink:#28312c;--sub:#6b756f;--warn:#b45309;--line:#e4e0d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 14px 40px}
  header{padding:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
  h1{font-size:1.25rem;color:var(--g)}
  #kidline{font-size:.8rem;color:var(--sub);margin-top:2px}
  #gear{background:none;border:none;font-size:1.2rem;padding:6px}
  .btnrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 12px}
  .scen{font-size:1.05rem;padding:16px 4px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-align:center;line-height:1.5}
  .scen small{display:block;font-size:.72rem;color:var(--sub)}
  .scen.on{border-color:var(--g);background:#ebf3ee}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chip{font-size:.8rem;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--sub)}
  .chip.on{border-color:var(--g);color:var(--g);background:#ebf3ee}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:1.05rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .badge{font-size:.68rem;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .stale{color:var(--warn);border-color:var(--warn)}
  .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--sub);margin:8px 0 6px}
  .meta b{color:var(--ink);font-weight:600}
  .reason{font-size:.85rem;margin:6px 0;line-height:1.55}
  .foot{font-size:.75rem;color:var(--sub);margin-top:6px;line-height:1.6}
  .rain{font-size:.82rem;background:#eef4fb;border-radius:8px;padding:7px 10px;margin-top:8px}
  #empty{color:var(--sub);font-size:.9rem;text-align:center;padding:30px 0}
  #setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  #setup h3{font-size:.95rem;margin-bottom:4px}
  #setup p{font-size:.76rem;color:var(--sub);margin-bottom:10px;line-height:1.5}
  .krow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-bottom:8px}
  .krow input{font-size:.9rem;padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  #save{width:100%;padding:12px;font-size:.95rem;background:var(--g);color:#fff;border:none;border-radius:10px;margin-top:4px}
  footer{font-size:.7rem;color:var(--sub);text-align:center;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<header>
  <div><h1>林家出遊手冊</h1><div id="kidline"></div></div>
  <button id="gear" aria-label="設定">⚙️</button>
</header>

<section id="setup" hidden>
  <h3>孩子設定(只需一次)</h3>
  <p>依隱私原則,出生年月不寫在網頁檔案裡;只儲存在這支手機的瀏覽器,不會上傳任何地方。</p>
  <div class="krow"><input id="n1" placeholder="稱呼(如:姊姊)"><input id="b1" type="month" aria-label="孩子1出生年月"></div>
  <div class="krow"><input id="n2" placeholder="稱呼(如:弟弟)"><input id="b2" type="month" aria-label="孩子2出生年月(可留空)"></div>
  <button id="save">儲存</button>
</section>

<div class="btnrow">
  <button class="scen" data-s="hot">☀️<small>晴熱</small></button>
  <button class="scen" data-s="rain">🌧<small>下雨</small></button>
  <button class="scen" data-s="cool">🍃<small>舒服</small></button>
</div>
<div class="chips">
  <button class="chip" data-f="free">免費優先</button>
  <button class="chip" data-f="meal">要有餐</button>
  <button class="chip" data-f="coffee">要有咖啡</button>
</div>

<div id="cards"></div>
<div id="empty" hidden>選一個天氣情境開始</div>

<footer>資料版本:2026-07-19・共 15 筆景點<br>車程與雨備分鐘為座標估算值;「待重驗」= 超過 6 個月未確認</footer>

const BUILD = "2026-07-19";
const LS = "lin-family-kids";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let scen = null, filters = { free: false, meal: false, coffee: false };

function kids() { try { return JSON.parse(localStorage.getItem(LS)) || [] } catch (e) { return [] } }
function monthsSince(ym) { const [y, m] = ym.split("-").map(Number); const n = new Date(); return (n.getFullYear() - y) * 12 + (n.getMonth() + 1 - m); }
function bandOf(mo) { const y = mo / 12; return y < 2 ? "0-2" : y < 4 ? "2-4" : y < 6 ? "4-6" : "6-9"; }
function kidInfo() { return kids().filter(k => k.b).map(k => { const mo = monthsSince(k.b); return { n: k.n || "孩子", mo, band: bandOf(mo) }; }); }

function num(x) { return typeof x === "number" ? x : 0.5; }   // 待確認 → 中性偏低,卡片另有標示
function isStale(v) { return (Date.now() - new Date(v.last_verified)) / 864e5 > 183; }
function wf(v) { const w = v.weather_fit; return scen === "hot" ? num(w["晴熱"]) : scen === "rain" ? (num(w["小雨"]) + num(w["大雨"])) / 2 : num(w["晴涼"]); }
function ageScore(v, bands) { if (!bands.length) return 1; return bands.reduce((a, b) => a + num(v.age_fit[b].score), 0) / bands.length; }
function score(v, bands) { return wf(v) * ageScore(v, bands) * (isStale(v) ? 0.7 : 1); }
function hotPri(v) { return num(v.shade) >= 2 ? 1 : 0; }      // 晴熱優先:遮蔭≥2(含全室內)
function driveNum(v) { return typeof v.drive === "number" ? v.drive : 99; }

function rank() {
  const bands = [...new Set(kidInfo().map(k => k.band))];
  let list = VENUES.filter(v => v.status !== "closed");
  if (filters.meal) list = list.filter(v => v.flags.meal);
  if (filters.coffee) list = list.filter(v => v.flags.coffee);
  list = list.map(v => ({ v, s: score(v, bands) }));
  list.sort((a, b) =>
    (filters.free ? (b.v.flags.free - a.v.flags.free) : 0) ||
    (scen === "hot" ? (hotPri(b.v) - hotPri(a.v)) : 0) ||
    (b.s - a.s) || (driveNum(a.v) - driveNum(b.v)));
  return { top: list.slice(0, 3), bands };
}

function bindingReason(v, ks) {
  if (!ks.length) return "";
  const worst = ks.reduce((a, k) => num(v.age_fit[k.band].score) < num(v.age_fit[a.band].score) ? k : a, ks[0]);
  return `適齡(${worst.band}):${v.age_fit[worst.band].reason}`;
}
function lastLog(v) { const l = v.family_log; return l && l.length ? `${l[l.length - 1].date}・${l[l.length - 1]["評分"]}/5・${l[l.length - 1]["心得"]}` : "尚無實測"; }
function backupOf(v) {
  if (!v.rain_backup_id) return "";
  if (v.rain_backup_id === "無備案") return `<div class="rain">🌧 雨天備案:無備案(已降權)</div>`;
  const b = VENUES.find(x => x.id === v.rain_backup_id);
  const d = b && typeof b.drive === "number" ? `(從家出發約 ${b.drive} 分)` : "";
  return `<div class="rain">🌧 雨天備案:${b ? b.name : v.rain_backup_id}${d}</div>`;
}

function render() {
  const ks = kidInfo();
  $("#kidline").textContent = ks.length ? ks.map(k => `${k.n} ${Math.floor(k.mo / 12)}歲${k.mo % 12}月(${k.band})`).join("・") : "尚未設定孩子";
  const cards = $("#cards"), empty = $("#empty");
  if (!scen) { cards.innerHTML = ""; empty.hidden = false; return; }
  empty.hidden = true;
  const { top, bands } = rank();
  cards.innerHTML = top.map(({ v, s }) => `
  <div class="card">
    <h2>${v.name} <span class="badge">${v.type}</span>${isStale(v) ? '<span class="badge stale">⚠️ 待重驗</span>' : ""}${v.status === "待確認" ? '<span class="badge stale">狀態待確認</span>' : ""}</h2>
    <div class="meta">
      <span>🚗 <b>${typeof v.drive === "number" ? v.drive + " 分" : "待確認"}</b></span>
      <span>🌳 遮蔭 <b>${typeof v.shade === "number" ? v.shade + "/3" : "待確認"}</b></span>
      <span>🔊 聲量容忍 <b>${typeof v.noise === "number" ? v.noise + "/3" : "待確認"}</b></span>
    </div>
    <div class="reason">${bindingReason(v, ks)}</div>
    <div class="foot">上次確認:${v.last_verified}・林家評價:${lastLog(v)}</div>
    ${v.type === "戶外公園" ? backupOf(v) : ""}
  </div>`).join("");
}

$$(".scen").forEach(b => b.onclick = () => { scen = b.dataset.s; $$(".scen").forEach(x => x.classList.toggle("on", x === b)); render(); });
$$(".chip").forEach(b => b.onclick = () => { const f = b.dataset.f; filters[f] = !filters[f]; b.classList.toggle("on", filters[f]); render(); });

function openSetup() {
  const k = kids();
  $("#n1").value = k[0] ? k[0].n : ""; $("#b1").value = k[0] ? k[0].b : "";
  $("#n2").value = k[1] ? k[1].n : ""; $("#b2").value = k[1] ? k[1].b : "";
  $("#setup").hidden = false;
}
$("#gear").onclick = openSetup;
$("#save").onclick = () => {
  const out = [];
  if ($("#b1").value) out.push({ n: $("#n1").value, b: $("#b1").value });
  if ($("#b2").value) out.push({ n: $("#n2").value, b: $("#b2").value });
  localStorage.setItem(LS, JSON.stringify(out));
  $("#setup").hidden = true; render();
};
if (!kids().length) openSetup();
render();
</script>
